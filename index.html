<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turn to Page… · The Black Root Press</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3EBDF;--sand:#E6DCCB;--ink:#1B1714;--accent:#6B4F3A;--muted:#8A7F72;--desk:#D9CCB8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--ink);font-family:"Libre Baskerville",Georgia,serif;
  display:flex;justify-content:center;padding:28px 14px;background-image:radial-gradient(rgba(27,23,20,.05) 1px,transparent 1px);background-size:6px 6px}
main{width:100%;max-width:560px;background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:36px 40px 28px;align-self:flex-start}
.kicker{margin:0;font-family:"Courier Prime",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:14px 0 8px;font-family:"Courier Prime",monospace;font-weight:400;font-size:clamp(32px,8vw,44px);text-transform:uppercase;line-height:1.05}
h1 span{color:var(--accent)}
.tag{margin:0 0 26px;font-style:italic;font-size:16px;line-height:1.5}
ul{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
li a{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px dashed var(--muted);color:var(--ink);text-decoration:none}
li a:hover{background:var(--sand)}
li b{display:block;font-family:"Courier Prime",monospace;text-transform:uppercase;font-size:17px}
li small{font-style:italic;font-size:14px}
.go{flex:none;font-family:"Courier Prime",monospace;font-weight:700;color:var(--accent)}
footer{margin-top:28px;padding-top:12px;border-top:3px dashed var(--accent);font-family:"Courier Prime",monospace;font-size:12px;line-height:1.6}
footer b{font-size:14px}
</style>
</head>
<body>
<main>
  <p class="kicker">Choose your own adventure</p>
  <h1>Turn to Page<span>…</span></h1>
  <p class="tag">Tiny adventures in making questionable decisions.</p>
  <ul>
    <li><a href="immortal-latte/"><span><b>The Immortal Latte</b><small>A three-dollar spellbook. One latte. Three endings.</small></span><span class="go">begin →</span></a></li>
  </ul>
  <footer><b>The Black Root Press</b><br>Portland, Oregon · theblackrootpress.com</footer>
</main>
</body>
</html>
