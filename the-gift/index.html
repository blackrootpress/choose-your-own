<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gift That Wasn’t Yours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3EBDF;--cream:#FBF7F0;--sand:#E6DCCB;--ink:#1B1714;--accent:#6B4F3A;--muted:#8A7F72;--desk:#D9CCB8;
  --mono:"Courier Prime",Courier,"Courier New",monospace;--serif:"Libre Baskerville",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--desk);color:var(--ink)}
body{font-family:var(--serif);display:flex;flex-direction:column;align-items:center;padding:20px 14px 40px;
  background-image:radial-gradient(rgba(27,23,20,.05) 1px,transparent 1px);background-size:6px 6px}
button{font:inherit;color:inherit;cursor:pointer}
.bar{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;
  font-family:var(--mono);font-size:13px;letter-spacing:.06em}
.bar .home{background:none;border:0;padding:4px 0;text-transform:uppercase;font-weight:700}
.bar .home:hover{color:var(--accent)}
.found{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;text-transform:uppercase}
.cups{display:flex;gap:4px}
.cup{width:16px;height:18px;border:2px solid var(--ink);border-top-width:3px;border-radius:0 0 4px 4px;background:transparent}
.cup.on{background:var(--accent)}
.book{width:100%;max-width:560px;perspective:1600px}
.page{position:relative;background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
  min-height:min(780px,calc(100vh - 110px));padding:36px 40px 26px;display:flex;flex-direction:column;transform-origin:left center}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(138,127,114,.12) 27px 28px)}
.page.turn{animation:turn .45s cubic-bezier(.3,.7,.3,1)}
@keyframes turn{from{transform:rotateY(-14deg) translateX(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.page.turn{animation:none}}
.kicker{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:6px 0 16px;font-family:var(--mono);font-weight:400;font-size:26px;line-height:1.15;text-transform:uppercase;text-wrap:balance}
.story p{margin:0 0 11px;font-size:15.5px;line-height:1.6}
.story p.i{font-style:italic;color:var(--accent)}
.story p.sign{display:inline-block;border:2px dashed var(--ink);padding:8px 14px;font-family:var(--mono);font-weight:700;letter-spacing:.06em;font-size:15px;margin:2px 0 14px}
.story p.caps{font-family:var(--mono);font-weight:700;letter-spacing:.1em;font-size:15.5px;margin-top:4px}
.art{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin:10px 0 14px;flex-wrap:wrap}
.art svg{display:block;height:auto;max-width:100%}
.art.one svg{width:min(330px,100%)}
.art.two svg:first-child{width:min(210px,52%)}
.art.two svg:last-child{width:min(165px,40%)}
.art svg{opacity:0;transform:translateY(6px) rotate(-1deg);transition:opacity .5s .15s,transform .5s .15s}
.art.in svg{opacity:1;transform:none}
.choices{margin-top:auto;border-top:2px solid var(--ink);padding-top:4px}
.choice{display:flex;width:100%;justify-content:space-between;align-items:center;gap:14px;text-align:left;
  background:none;border:0;border-bottom:1px dashed var(--muted);padding:13px 4px;font-size:15.5px;transition:background .15s}
.choice .go{flex:none;font-family:var(--mono);font-weight:700;color:var(--accent);font-size:14.5px;transition:transform .15s}
.choice:hover,.choice:focus-visible{background:var(--sand);outline:none}
.choice:hover .go,.choice:focus-visible .go{transform:translateX(4px)}
.choice kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--muted);border-radius:3px;padding:0 4px;margin-right:8px;color:var(--muted)}
.end{margin-top:auto;border-top:2px solid var(--ink);padding-top:12px}
.end .big{margin:0;font-family:var(--mono);font-size:24px;font-weight:700;color:var(--accent)}
.end .unlock{margin:4px 0 12px;font-family:var(--mono);font-size:13px;letter-spacing:.05em}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:var(--sand);padding:10px 14px;font-family:var(--mono);font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--cream)}
.folio{margin-top:18px;padding-top:6px;border-top:2px dashed var(--accent);display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.folio b{font-size:16px}
.folio button{background:none;border:0;padding:0;font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.folio button:hover{color:var(--accent)}
/* cover */
.cover h1{font-size:clamp(30px,7vw,40px);margin:18px 0 0}
.cover .art.one svg{width:min(340px,100%)}
.cover .tagline{font-style:italic;font-size:17px;line-height:1.5;margin:12px 0 0}
.cover .hint{font-style:italic;font-size:14px;margin:12px 0 0}
.press{margin-top:22px;padding-top:12px;border-top:3px dashed var(--accent);font-family:var(--mono);font-size:12px;line-height:1.5}
.press b{font-size:14px}
/* endings */
.list{margin:6px 0 0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--muted)}
.list .num{font-family:var(--mono);font-weight:700;color:var(--accent);width:56px;flex:none}
.list .t{flex:1}
.list .t small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.list li.locked .t{color:var(--muted)}
.list button{background:none;border:0;font-family:var(--mono);font-weight:700;color:var(--accent);padding:4px}
.colophon{margin-top:auto;padding-top:12px;border-top:1px dashed var(--muted);font-family:var(--mono);font-size:12px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:var(--ink);color:var(--cream);font-family:var(--mono);
  font-size:13px;padding:10px 16px;border-radius:2px;transition:transform .35s cubic-bezier(.3,.7,.3,1);z-index:9}
.toast.show{transform:translate(-50%,0)}
@media (max-width:480px){.page{padding:26px 22px 20px;box-shadow:4px 4px 0 var(--ink)}h1{font-size:22px}.story p{font-size:15px}}
</style>
</head>
<body>
<div class="bar">
  <button class="home" id="home" aria-label="Back to the cover">🎁 The Gift</button>
  <button class="found" id="found" aria-label="Endings found"><span id="foundTxt">Endings 0/3</span><span class="cups" id="cups"></span></button>
</div>
<main class="book"><article class="page" id="page" aria-live="polite"></article></main>
<div class="toast" id="toast" role="status"></div>

const PAGES = {"2": {"title": "An Unexpected Delivery", "body": [["p", "It’s a cold December evening. You’re expecting no packages, so the small parcel on your doorstep is a surprise. It’s wrapped in brown paper and tied with red string. There’s no return address. The tag reads:"], ["sign", "FOR WHOEVER NEEDS THIS MOST."], ["p", "The package is warm. Not unpleasantly warm. More like a loaf of bread fresh from the oven."], ["p", "Something inside moves. You pick it up. It makes a tiny sound, almost like a sigh."]], "art": [], "choices": [["Open the package?", 3], ["Find someone else to give it to?", 4]]}, "3": {"title": "What’s Inside", "body": [["p", "You untie the string. The paper falls away. Inside is a small wooden box. You open it."], ["p", "A tiny creature looks up at you. It’s covered in soft gray fur, with enormous ears and a knitted scarf far too long for its body. It appears annoyed."], ["p", "“Finally,” it says."], ["p", "You stare."], ["p", "“You’re late,” it adds."], ["p", "“Late for what?”"], ["p", "The creature sighs. “For whatever it is you haven’t been doing.”"], ["p", "It holds out a tiny hand."]], "art": ["<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 170\" role=\"img\" aria-label=\"A tiny annoyed creature with soft gray fur, enormous ears and a very long knitted scarf, holding out its hand\"><path d=\"M79.4 89.6 C73.1 86.7 60.8 72.6 53.0 61.0 C45.3 49.4 30.9 24.8 32.8 20.0 C34.7 15.2 55.0 22.5 64.6 32.3 C74.2 42.1 88.1 69.0 90.5 78.5 C93.0 88.1 85.6 92.5 79.4 89.6 Z\" fill=\"#BDB6AD\" stroke=\"none\"></path><path d=\"M108.7 78.5 C110.6 68.8 121.2 43.2 130.2 32.7 C139.2 22.1 158.9 11.2 162.6 15.1 C166.3 19.1 159.8 43.5 152.4 56.1 C145.0 68.8 125.7 87.4 118.4 91.1 C111.1 94.8 106.7 88.3 108.7 78.5 Z\" fill=\"#BDB6AD\" stroke=\"none\"></path><path d=\"M132.8 111.5 C133.0 115.1 132.9 118.3 131.4 121.8 C129.9 125.2 126.4 129.2 123.8 132.0 C121.1 134.8 118.9 136.8 115.5 138.5 C112.1 140.2 107.6 141.3 103.6 142.1 C99.6 142.9 95.6 143.6 91. .9 110.5 212.3 110.1 210.8 110.2 C209.3 110.3 208.6 111.3 207.2 111.3 C205.8 111.3 203.9 110.9 202.6 110.4 C201.4 110.0 200.4 109.0 199.9 108.7 C199.4 108.4 199.3 109.0 199.5 108.7 C199.7 108.4 200.5 107.3 201.1 106.9 C201.7 106.4 202.1 106.4 203.1 106.0 C204.0 105.6 205.3 104.7 206.7 104.6 C208.2 104.6 210.4 105.7 211.8 105.7 C213.2 105.8 213.6 105.2 214.9 105.0 C216.3 104.8 218.7 104.6 219.8 104.7 C220.9 104.9 221.5 105.5 221.8 106.1 C222.1 106.6 221.8 107.8 221.6 108.2 Z\" fill=\"none\" stroke=\"#1B1714\" stroke-width=\"1.60\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M221.3 107.6 C221.5 108.1 221.9 108.3 221.5 108.7 C221.1 109.1 219.7 109.8 218.8 110.2 C217.9 110.5 217.6 110.8 216.2 111.0 C214.8 111.2 212.0 111.4 210.4 111.3 C208.9 111.2 208.0 110.7 206.9 110.3 C205.8 109.9 204.6 109.0 203.8 108.9 C202.9 108.9 202.8 110.1 202.0 110.0 C201.2 110.0 199.3 108.8 198.9 108.5 C198.6 108.2 199.3 108.4 200.0 108.0 C200.6 107.7 202.1 106.9 203.1 106.5 C204.2 106.1 205.1 105.7 206.2 105.6 C207.3 105.5 208.5 105.9 209.9 105.7 C211.3 105.5 213.2 104.4 214.6 104.4 C216.1 104.5 217.7 105.6 218.6 105.9 C219.5 106.2 219.6 105.8 220.1 106.1 C220.5 106.3 221.0 107.2 221.3 107.6 Z\" fill=\"none\" stroke=\"#1B1714\" stroke-width=\"0.88\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\"0.55\"></path></svg>"], "choices": [["Stay for tea?", 6], ["Leave the parcel with her?", 7]]}, "5": {"title": "A Very Small Journey", "body": [["p", "The creature takes your hand. The room disappears. Suddenly, you’re standing in your childhood kitchen. There are familiar sounds. A familiar smell. Someone is laughing in another room. You know this place. You haven’t thought about it in years."], ["p", "The creature sits on the counter. “People always expect gold or wishes,” it says. “That’s not really my department.”"], ["p", "“What is?”"], ["p", "It shrugs. “Sometimes people just need to remember a nice thing.”"], ["p", "The room begins to fade. When you return home, the box is empty. But your apartment smells faintly of something warm and familiar. You make yourself a cup of tea. For once, you don’t hurry."]], "art": [], "ending": "A Very Small Journey"}, "6": {"title": "Tea for Two", "body": [["p", "One way or another, you end up sitting at a kitchen table with another person. There are two mugs and a plate of slightly stale biscuits. Nobody seems particularly interested in explaining the mysterious package."], ["p", "Instead, you talk. About the weather. About bad jobs. About the peculiar things people leave in apartment hallways."], ["p", "An hour passes. Then another. Eventually, you remember the parcel. It’s gone."], ["p", "In its place is a small card."], ["i", "Well done."], ["p", "On the reverse:"], ["i", "Sometimes the gift is an excuse."], ["p", "You turn the card over again. You think about the evening you’ve just had. You decide not to question it."]], "art": [], "ending": "Tea for Two"}, "7": {"title": "The Next Door", "body": [["p", "You leave the parcel with your neighbor."], ["p", "She thanks you, though she seems a little confused."], ["p", "The following morning, you find a note outside your door."], ["i", "Thank you. I didn’t realize how much I needed that."], ["p", "Below it, in much smaller handwriting:"], ["i", "Apparently I’m supposed to pass it along."], ["p", "You smile."], ["p", "Over the next several weeks, you hear rumors of a strange package making its way through the neighborhood."], ["p", "A little boy gives it to his grandmother."], ["p", "A tired baker leaves it for a friend."], ["p", "Someone finds it outside the animal shelter."], ["p", "Nobody seems entirely sure what’s inside."], ["p", "But everyone insists it arrived at just the right time."]], "art": [], "ending": "The Next Door"}};
const CFG = {"key": "turn-to-page-the-gift", "title": "The Gift That Wasn’t Yours", "tag": "A peculiar little winter story.", "icon": "🎁", "allDone": "Every door knocked. The parcel finally feels at home.", "forget": "Endings forgotten. The parcel is back on your doorstep."};
const ENDS = Object.keys(PAGES).filter((k) => PAGES[k].ending);
const NE = ENDS.length;
const $ = (id) => document.getElementById(id);
const pageEl = $("page");
let found = new Set(), trail = [];
try { found = new Set(JSON.parse(localStorage.getItem(CFG.key) || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem(CFG.key, JSON.stringify([...found])); } catch (e) {} };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function cups() {
  $("cups").innerHTML = ENDS.map((e) => `<span class="cup ${found.has(e) ? "on" : ""}"></span>`).join("");
  $("foundTxt").textContent = `Endings ${found.size}/${NE}`;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); }

function folio(n) {
  const back = trail.length ? `<button data-back>← back a page</button>` : `<span></span>`;
  return n % 2 === 0
    ? `<div class="folio"><b>${n}</b>${back.replace("<span></span>", "")}<span>TURN TO PAGE…</span></div>`
    : `<div class="folio"><span>TURN TO PAGE…</span>${back.replace("<span></span>", "")}<b>${n}</b></div>`;
}

function renderCover() {
  pageEl.className = "page cover";
  pageEl.innerHTML = `
    <p class="kicker">A Turn to Page… adventure</p>
    <h1>${esc(CFG.title)}</h1>
    ${CFG.tag ? `<p class="tagline">${esc(CFG.tag)}</p>` : ""}
    <div class="art one" style="margin:auto 0;padding:16px 0">${$("coverArt").innerHTML}</div>
    <div class="btns"><button class="btn" data-go="2">Turn to page 2 to begin →</button>
      ${found.size ? `<button class="btn ghost" data-go="endings">Endings found (${found.size}/${NE})</button>` : ""}</div>
    <p class="hint">Make a choice, then turn to the page it tells you. No save points required.</p>
    <div class="press"><b>The Black Root Press</b><br>Portland, Oregon</div>`;
}

function renderPage(n) {
  const p = PAGES[n];
  const body = p.body.map(([k, t]) => `<p class="${k === "p" ? "" : k}">${esc(t)}</p>`).join("");
  let tail;
  if (p.choices) {
    tail = `<div class="choices">${p.choices.map(([t, to], i) =>
      `<button class="choice" data-go="${to}"><span><kbd>${i + 1}</kbd>${esc(t)}</span><span class="go">turn to ${to} →</span></button>`).join("")}</div>`;
  } else {
    const fresh = !found.has(n);
    if (fresh) { found.add(n); save(); cups(); }
    const left = NE - found.size;
    tail = `<div class="end"><p class="big">THE END.</p>
      <p class="unlock">${fresh ? "New ending unlocked: " : "Ending: "}<b>${esc(p.ending)}</b> · ${left ? `${left} still out there` : "you’ve found them all"}</p>
      <div class="btns"><button class="btn" data-go="2" data-reset>Want to try another path? Return to page 2 →</button>
      <button class="btn ghost" data-go="endings">All endings</button></div></div>`;
    if (fresh) setTimeout(() => toast(left ? `${CFG.icon} Ending found (${found.size}/${NE})` : `${CFG.icon} All ${NE} endings found!`), 450);
  }
  pageEl.className = "page";
  pageEl.innerHTML = `<p class="kicker">${esc(CFG.title)}</p><h1>${esc(p.title)}</h1>
    <div class="story">${body}</div>
    <div class="art ${p.art.length > 1 ? "two" : "one"}">${p.art.join("")}</div>${tail}${folio(+n)}`;
}

function renderEndings() {
  const items = ENDS.map((e) => {
    const p = PAGES[e], on = found.has(e);
    return `<li class="${on ? "" : "locked"}"><span class="num">p. ${e}</span><span class="t">${on ? esc(p.title) : "??? ???"}<small>${on ? esc(p.ending) : "Not found yet"}</small></span>
      ${on ? `<button data-go="${e}">reread →</button>` : ""}</li>`;
  }).join("");
  pageEl.className = "page";
  pageEl.innerHTML = `<p class="kicker">${esc(CFG.title)}</p><h1>Endings Found: ${found.size} of ${NE}</h1>
    <p style="margin:0 0 6px;font-size:15px;line-height:1.6">${found.size === NE ? esc(CFG.allDone) : "Some paths are still out there. Every choice starts on page 2."}</p>
    <ul class="list">${items}</ul>
    <div class="art one" style="margin:26px 0 18px"><div style="width:min(240px,70%)">${$("bookArt").innerHTML}</div></div>
    <div class="btns"><button class="btn" data-go="2" data-reset>Start again on page 2 →</button>
      ${found.size ? `<button class="btn ghost" data-clear>Forget my endings</button>` : ""}</div>
    <div class="colophon" style="margin-top:22px"><b>${esc(CFG.title.toUpperCase())}</b><br>Written by Luke Allis<br>The Black Root Press · Portland, Oregon · November 2026<br>theblackrootpress.com</div>`;
}

function show(view, push = true) {
  if (push) { const cur = location.hash.slice(1) || "cover"; if (cur !== view) history.pushState(null, "", view === "cover" ? location.pathname : "#" + view); }
  const n = view.startsWith("page-") ? view.slice(5) : null;
  if (n && PAGES[n]) renderPage(n); else if (view === "endings") renderEndings(); else renderCover();
  pageEl.classList.remove("turn"); void pageEl.offsetWidth; pageEl.classList.add("turn");
  requestAnimationFrame(() => setTimeout(() => pageEl.querySelectorAll(".art").forEach((a) => a.classList.add("in")), 30));
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  const first = pageEl.querySelector(".choice, .btn"); if (first && push) first.focus({ preventScroll: true });
}
function go(target, reset) {
  const cur = location.hash.slice(1) || "cover";
  if (reset) trail = []; else if (cur.startsWith("page-")) trail.push(cur);
  show(target === "endings" ? "endings" : target === "cover" ? "cover" : "page-" + target);
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go) go(b.dataset.go, "reset" in b.dataset);
  else if ("back" in b.dataset) { const prev = trail.pop(); if (prev) show(prev); }
  else if ("clear" in b.dataset) { found.clear(); save(); cups(); renderEndings(); toast(CFG.forget); }
});
$("home").onclick = () => { trail = []; show("cover"); };
$("found").onclick = () => show("endings");
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const ch = [...pageEl.querySelectorAll(".choice")];
  if (/^[12]$/.test(e.key) && ch[+e.key - 1]) ch[+e.key - 1].click();
});
window.addEventListener("hashchange", () => show(location.hash.slice(1) || "cover", false));
window.addEventListener("popstate", () => show(location.hash.slice(1) || "cover", false));
cups();
show(location.hash.slice(1) || "cover", false);
</script>
</body>
</html>
